<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中汇文件销售分析助手</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS (xlsx.full.min.js) CDN for local Excel/CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- CSS Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Fullscreen drag overlay -->
  <div id="drag-overlay" class="dragover-overlay">
    <div class="upload-icon">📥</div>
    <h2>拖拽到此处上传销售文件</h2>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="logo-section">
        <h1>中汇<span>文件销售分析助手</span></h1>
        <p>支持拖拽分析 Excel (.xlsx, .xls) 和 CSV 格式销售报告</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" id="upload-btn">📂 上传文件</button>
        <button class="btn" id="load-demo">📊 加载演示数据</button>
      </div>
    </header>

    <!-- Welcome / Upload area when no file is loaded -->
    <section id="welcome-card" class="upload-card">
      <div class="upload-icon">📊</div>
      <h3>开始分析您的销售数据</h3>
      <p>拖拽文件至此区域，或点击此处选择本地文件。您的数据完全在本地浏览器端处理，不会上传到任何服务器。</p>
      <button class="btn btn-primary">选择文件</button>
      <input type="file" id="file-input" accept=".xlsx, .xls, .csv">
    </section>

    <!-- Excel Sheet Tab Selector -->
    <div id="tabs-container" class="tabs-container hidden"></div>

    <!-- Main Dashboard Section (revealed when data loaded) -->
    <main id="dashboard-content" class="dashboard-content">
      <!-- KPI cards grid -->
      <section class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-header">
            <span>累计销售额</span>
            <span class="text-gold">¥</span>
          </div>
          <div class="kpi-value" id="total-sales-val">¥0</div>
          <div class="kpi-subtitle">所选条件下的销售额总计</div>
        </div>

        <div class="kpi-card kpi-blue">
          <div class="kpi-header">
            <span>总销量</span>
            <span style="color: var(--color-blue)">📦</span>
          </div>
          <div class="kpi-value" id="total-qty-val">0</div>
          <div class="kpi-subtitle">售出产品件数总计</div>
        </div>

        <div class="kpi-card kpi-green">
          <div class="kpi-header">
            <span>交易笔数</span>
            <span style="color: var(--color-green)">📝</span>
          </div>
          <div class="kpi-value" id="transactions-val">0</div>
          <div class="kpi-subtitle">成交订单交易行总数</div>
        </div>

        <div class="kpi-card kpi-red">
          <div class="kpi-header">
            <span>客单价 (AOV)</span>
            <span style="color: var(--color-red)">📈</span>
          </div>
          <div class="kpi-value" id="avg-order-val">¥0</div>
          <div class="kpi-subtitle">单笔交易所含平均销售额</div>
        </div>
      </section>

      <!-- Charts Grid -->
      <section class="charts-section">
        <!-- Left large Chart (Line chart for sales trend) -->
        <div class="chart-card">
          <div class="chart-header">
            <h3 class="chart-title">销售额趋势分析</h3>
          </div>
          <div class="chart-container">
            <canvas id="salesTrendChart"></canvas>
          </div>
        </div>

        <!-- Right Doughnut Chart (Category or region share) -->
        <div class="chart-card">
          <div class="chart-header">
            <h3 class="chart-title">产品类别占比</h3>
          </div>
          <div class="chart-container">
            <canvas id="categoryShareChart"></canvas>
          </div>
        </div>

        <!-- Horizontal or vertical Bar chart (Top products) -->
        <div class="chart-card" style="grid-column: 1 / -1;">
          <div class="chart-header">
            <h3 class="chart-title">最畅销产品 Top 8</h3>
          </div>
          <div class="chart-container">
            <canvas id="productPerformanceChart"></canvas>
          </div>
        </div>
      </section>

      <!-- Data Explorer Table Section -->
      <section class="table-section">
        <div class="table-header-bar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="搜索产品、类别、销售员、地区...">
          </div>
          <div class="filter-group">
            <select id="rep-filter" class="select-filter">
              <option value="">所有销售员</option>
            </select>
            <select id="region-filter" class="select-filter">
              <option value="">所有地区</option>
            </select>
            <select id="category-filter" class="select-filter">
              <option value="">所有类别</option>
            </select>
          </div>
        </div>

        <!-- Table Grid -->
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th onclick="sortTable('date')">日期</th>
                <th onclick="sortTable('product')">产品名称</th>
                <th onclick="sortTable('category')">类别</th>
                <th onclick="sortTable('rep')">销售员</th>
                <th onclick="sortTable('region')">地区</th>
                <th onclick="sortTable('sales')">销售额</th>
                <th onclick="sortTable('quantity')" class="text-right">数量</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="pagination">
          <span id="pagination-info">显示 0 到 0 条，共 0 条</span>
          <div class="pagination-controls">
            <button id="prev-page" class="pagination-btn" disabled>上一页</button>
            <button id="next-page" class="pagination-btn" disabled>下一页</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Custom Scripts -->
  <script src="sample_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
